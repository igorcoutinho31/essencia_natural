# Cloudflare Workers — Essência Natural. Passo a passo em docs/CLOUDFLARE.md.
name = "essencia-natural"
main = "src/worker.js"
# Conta Cloudflare da loja (todo comando do wrangler vai para ela).
account_id = "75f388661b59a17b2cc18ee60a32f5c1"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Domínio oficial (o domínio precisa estar ATIVO nesta conta da Cloudflare —
# ver docs/CLOUDFLARE.md, passo 7). O endereço sem "www" é redirecionado
# para o "www" (Worker + Redirect Rule).
routes = [
  { pattern = "www.lojaessencianatural.com.br", custom_domain = true },
  { pattern = "lojaessencianatural.com.br", custom_domain = true },
]

# Roda o Worker perto do banco D1 (várias consultas por página ficam
# rápidas); os arquivos estáticos continuam saindo da borda mais próxima
# do visitante.
[placement]
mode = "smart"

# Arquivos estáticos: só a pasta public/ é publicada. public/_headers
# aplica os cabeçalhos de segurança e de cache.
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"
run_worker_first = ["/api/*", "/admin", "/admin/*", "/produto/*", "/uploads/*", "/sitemap.xml", "/health", "/favicon.ico"]

[[d1_databases]]
binding = "DB"
database_name = "essencia-natural"
database_id = "ecb7f931-21db-44b4-868f-790793349a19"
migrations_dir = "migrations"

# Fotos enviadas pelo /admin: por padrão ficam no próprio D1 (plano
# grátis, sem cartão). Para usar o R2 (ativar o R2 pede cartão, mesmo sem
# cobrar dentro da cota), crie o bucket e descomente as três linhas:
# [[r2_buckets]]
# binding = "UPLOADS"
# bucket_name = "essencia-natural-uploads"

# Cloudflare Images (cota grátis de 5 mil transformações por mês): reduz as
# fotos originais grandes do fornecedor para 1200 px (fotos em alta
# automáticas, src/services/fotosAuto.js) e otimiza as fotos enviadas pelo
# painel (src/images.js). Se a cota acabar ou falhar, nada quebra: a foto
# fica como está e o cron tenta de novo depois.
[images]
binding = "IMAGES"

[triggers]
crons = ["*/10 * * * *"]

[vars]
SITE_URL = "https://www.lojaessencianatural.com.br"
OLISEK_API_URL = "https://olisek.com.br/api/v1"
# "1" liga a sincronização automática do estoque com a OliSek (só produtos
# com vínculo confirmado), a cada 30 minutos. Ver docs/OLISEK-INTEGRATION.md.
OLISEK_AUTO_SYNC = "0"
# OLISEK_LOGIN e OLISEK_PASSWORD são segredos: `npx wrangler secret put OLISEK_LOGIN`.

[observability]
enabled = true
